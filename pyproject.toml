[project]
name = "yadirect-mcp"
version = "0.2.0"
description = "MCP server for Yandex Direct reports and guarded campaign setup"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "yandex-direct",
    "advertising",
    "ppc",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
]
dependencies = [
    # Нижняя граница: до 1.14.0 FastMCP.Tool.from_function падает на строковых
    # аннотациях (`from __future__ import annotations`) — issubclass() arg 1 must
    # be a class. Верхняя: в mcp 2.0.0 пакет mcp.server.fastmcp удалён.
    "mcp>=1.14.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Lermont/yamcp"
Repository = "https://github.com/Lermont/yamcp.git"
Documentation = "https://github.com/Lermont/yamcp#readme"
Issues = "https://github.com/Lermont/yamcp/issues"
Changelog = "https://github.com/Lermont/yamcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # Верхняя граница по той же причине, по которой ниже зафиксирован select:
    # линтер добавляет правила в минорных версиях, и CI краснеет от обновления
    # инструмента, а не от изменения кода.
    "ruff>=0.6,<0.17",
    "twine>=5.1",
]

[project.scripts]
yadirect-mcp = "yadirect_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yadirect_mcp"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Набор правил фиксируем явно. Без select ruff берёт свой дефолт, а он
# расширяется от версии к версии: CI краснеет на релизе линтера, при том что
# ни одна строка кода не менялась. Здесь выбраны правила, которые ловят ошибки
# (F, B, PYI, PLE, ASYNC), держат единый стиль (E, W, I, UP, SIM) и защищают
# два места, где этот проект уже обжигался: часовой пояс (DTZ) и слишком
# широкий except, глотающий ошибку API (BLE).
#
# Сознательно НЕ включены: RUF001/RUF002 (весь проект на русском, и каждая
# кириллическая буква для них — «неоднозначный символ»), TRY003 (длинные
# сообщения об ошибках здесь читает модель, и они обязаны быть подробными),
# PLR2004 (сравнение с ожидаемым числом — это и есть тест).
select = ["E", "W", "F", "I", "UP", "B", "SIM", "BLE", "DTZ", "PYI", "ASYNC", "PLE"]

[tool.ruff.lint.per-file-ignores]
# Тесты пишут файлы из async-функций напрямую. Правило про trio/anyio.Path
# адресовано боевому коду с event loop под нагрузкой, а не проверке выгрузки.
"test_*.py" = ["ASYNC240"]
